apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 2s

    scrape_configs:
      - job_name: "kafka"
        static_configs:
          - targets: ["kafka-broker:9092"]

      - job_name: "producer-events"
        metrics_path: /metrics
        static_configs:
          - targets: ["producer-service:8080"]

