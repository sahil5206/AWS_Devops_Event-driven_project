version: "3"
services:
  zookeeper:
    image: wurstmeister/zookeeper
    ports:
      - "2181:2181"

  kafka:
    image: wurstmeister/kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

  producer:
    build: .
    command: ["java", "ProducerApp"]
    ports:
      - "8080:8080"
    depends_on:
      - kafka

  consumer:
    build: .
    command: ["java", "ConsumerApp"]
    depends_on:
      - kafka
