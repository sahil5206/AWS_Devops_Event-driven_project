<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Event Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🌐 Real-Time Event Dashboard</h1>
  </header>

  <main>
    <section id="event-form">
      <h2>Send Event</h2>
      <input type="text" id="eventName" placeholder="Enter event name (e.g. user_click)">
      <button id="sendEvent">Send Event</button>
    </section>

    <section id="event-log">
      <h2>Recent Events</h2>
      <ul id="eventList"></ul>
    </section>
  </main>

  <footer>
    <p>Powered by Kafka + GKE + Prometheus + Grafana</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
